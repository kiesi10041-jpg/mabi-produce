<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소울 리버레이트 제작 파티 현황판</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151d2a;
            --card-border: #233146;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --gold-main: #f59e0b;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-purple: #c084fc;
            --danger-red: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px 12px 100px 12px;
            line-height: 1.5;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        header {
            background: rgba(21, 29, 42, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid var(--card-border);
            padding: 20px 24px;
            border-radius: 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .title-area h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--gold-main);
            cursor: pointer;
            user-select: none;
        }

        .update-time { font-size: 0.8rem; color: var(--text-sub); margin-top: 4px; }

        .admin-badge {
            font-size: 0.8rem;
            background-color: var(--danger-red);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            display: none;
        }

        body.is-admin .admin-badge { display: inline-block; }

        .admin-only { display: none !important; }
        body.is-admin .admin-only { display: block !important; }
        body.is-admin .user-only { display: none !important; }

        .progress-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .progress-title {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--gold-main);
        }

        .bar-outer {
            width: 100%;
            height: 12px;
            background-color: #0b0f19;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }

        .bar-inner {
            height: 100%;
            background: linear-gradient(90deg, var(--gold-main), var(--accent-green));
            width: 0%;
            transition: width 0.3s ease;
        }

        .party-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 24px;
        }

        .party-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 1rem;
            font-weight: bold;
            color: var(--accent-blue);
        }

        .member-tags { display: flex; flex-wrap: wrap; gap: 8px; }

        .member-tag {
            background: #0b0f19;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .del-btn { color: var(--danger-red); cursor: pointer; font-weight: bold; margin-left: 4px; }

        .add-member-form { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

        .add-member-form input, .add-member-form select {
            padding: 6px 12px;
            background: #0b0f19;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            color: white;
            outline: none;
        }

        .btn-sm {
            padding: 6px 12px;
            background: var(--gold-main);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .goal-tags { display: flex; flex-direction: column; gap: 8px; }
        
        .goal-item {
            background: #0b0f19;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .goal-item:hover { border-color: var(--accent-blue); }

        .goal-item.main-active {
            border: 1.5px solid var(--accent-green);
            background: rgba(34, 197, 94, 0.08);
        }

        .goal-item.view-selected { border: 1.5px solid var(--accent-blue); }

        .goal-maker { color: var(--accent-blue); font-weight: bold; }
        .goal-target { color: var(--gold-main); font-weight: bold; margin-left: 6px; }

        .badge-main {
            font-size: 0.75rem;
            background: rgba(34, 197, 94, 0.25);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            margin-left: 8px;
        }

        .badge-viewing {
            font-size: 0.75rem;
            background: rgba(56, 189, 248, 0.2);
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            margin-left: 6px;
        }

        .badge-waiting {
            font-size: 0.75rem;
            background: rgba(148, 163, 184, 0.15);
            color: var(--text-sub);
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 8px;
        }

        .btn-activate {
            background: rgba(56, 189, 248, 0.2);
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
        }

        .section-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sec-my .section-title { color: var(--accent-green); }
        .sec-summary .section-title { color: var(--accent-purple); }
        .sec-rem .section-title { color: var(--gold-main); }
        .sec-admin-input .section-title { color: var(--danger-red); }

        .toggle-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: var(--text-sub);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toggle-btn:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.15); }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }

        .summary-card {
            background: #0b0f19;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .summary-card.is-completed {
            border-color: rgba(56, 189, 248, 0.4);
            background: rgba(56, 189, 248, 0.05);
        }

        .summary-card.is-common {
            border: 1px solid var(--accent-purple);
            background: rgba(192, 132, 252, 0.05);
        }

        .summary-name { font-weight: bold; font-size: 0.95rem; color: var(--text-main); }

        .common-badge {
            font-size: 0.7rem;
            background: rgba(192, 132, 252, 0.2);
            color: var(--accent-purple);
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
        }

        .summary-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .summary-rem { font-weight: bold; color: var(--gold-main); }
        .summary-completed-text { font-weight: bold; color: var(--accent-blue); }

        .item-grid { display: flex; flex-direction: column; gap: 10px; }

        .item-card {
            background-color: #0b0f19;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: all 0.2s;
        }

        .item-card.is-done {
            border: 1px solid var(--accent-green);
            background: rgba(34, 197, 94, 0.04);
        }

        .item-main-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .item-name { font-size: 1rem; font-weight: 700; }

        .item-qty-tag {
            font-size: 0.85rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .qty-have { background-color: rgba(34, 197, 94, 0.15); color: var(--accent-green); }
        .qty-need { background-color: rgba(245, 158, 11, 0.15); color: var(--gold-main); }
        .qty-done { background-color: rgba(56, 189, 248, 0.2); color: var(--accent-blue); border: 1px solid var(--accent-blue); }

        .admin-table-container { overflow-x: auto; }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .admin-table th, .admin-table td {
            padding: 10px 12px;
            border: 1px solid var(--card-border);
            text-align: left;
        }

        .admin-table th { background: #0b0f19; color: var(--accent-blue); font-weight: bold; }

        .admin-table input[type="number"] {
            width: 80px;
            padding: 6px;
            background: #0b0f19;
            border: 1px solid var(--accent-blue);
            color: white;
            border-radius: 4px;
            text-align: right;
            font-weight: bold;
        }

        .admin-table input[type="text"] {
            width: 100%;
            padding: 6px;
            background: #0b0f19;
            border: 1px solid var(--card-border);
            color: white;
            border-radius: 4px;
        }

        .floating-board-container { position: fixed; bottom: 25px; right: 25px; z-index: 900; }

        .floating-board-btn {
            background: linear-gradient(135deg, var(--accent-blue), #0284c7);
            color: #000;
            font-weight: 800;
            padding: 14px 22px;
            border-radius: 30px;
            border: none;
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .floating-board-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(56, 189, 248, 0.6);
        }

        .unread-badge {
            position: absolute;
            top: -6px; right: -6px;
            background-color: var(--danger-red);
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 12px;
            border: 2px solid var(--bg-color);
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            display: none;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-overlay.open { display: flex; }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            width: 100%;
            max-width: 650px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        .modal-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 { font-size: 1.15rem; color: var(--accent-blue); margin: 0; display: flex; align-items: center; gap: 8px; }
        
        .close-modal {
            background: transparent;
            border: none;
            color: var(--text-sub);
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .board-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #0b0f19;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
        }

        .board-inputs { display: flex; gap: 10px; flex-wrap: wrap; }

        .board-inputs select, .board-inputs input {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            color: white;
            padding: 8px 12px;
            font-size: 0.9rem;
            outline: none;
        }

        .board-inputs select { flex: 1; min-width: 130px; cursor: pointer; }
        .board-inputs input[type="password"] { width: 120px; }

        .board-textarea {
            width: 100%;
            height: 70px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            color: white;
            padding: 10px;
            font-size: 0.9rem;
            resize: none;
            outline: none;
        }

        .btn-board {
            align-self: flex-end;
            padding: 8px 20px;
            background: var(--accent-blue);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .board-list { display: flex; flex-direction: column; gap: 10px; }

        .board-item {
            background: #0b0f19;
            border: 1px solid var(--accent-blue);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.1);
        }

        .board-item.applied {
            opacity: 0.55;
            background: #080c14;
            border-color: var(--card-border);
            box-shadow: none;
        }

        .applied-badge {
            font-size: 0.75rem;
            background: rgba(34, 197, 94, 0.2);
            color: var(--accent-green);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            margin-left: 6px;
        }

        .target-weapon-tag {
            font-size: 0.75rem;
            background: rgba(245, 158, 11, 0.2);
            color: var(--gold-main);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            margin-left: 6px;
        }

        .board-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .board-writer { font-weight: bold; color: var(--accent-blue); }

        .board-actions button {
            background: transparent;
            border: none;
            color: var(--text-sub);
            font-size: 0.75rem;
            cursor: pointer;
            margin-left: 6px;
        }

        .board-actions button:hover { color: var(--danger-red); }

        .btn-apply-toggle {
            background: rgba(34, 197, 94, 0.15) !important;
            color: var(--accent-green) !important;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block !important;
        }

        .save-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            display: none;
            z-index: 800;
            gap: 10px;
        }

        body.is-admin .save-bar { display: flex; }

        .btn-save {
            flex: 2;
            padding: 14px;
            background-color: var(--gold-main);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(245, 158, 11, 0.3);
        }

        .btn-undo {
            flex: 1;
            padding: 14px;
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--danger-red);
            border: 1px solid var(--danger-red);
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="title-area">
            <h1 id="secretTrigger">소울 리버레이트 제작 파티 현황판</h1>
            <div class="update-time" id="last-update-time">최종 업데이트: -</div>
        </div>
        <span class="admin-badge" id="adminBadge">관리자 편집 모드</span>
    </header>

    <!-- 전체 준비 완료율 ProgressBar -->
    <div class="progress-box">
        <div class="progress-title">
            <span id="active-goal-title">현재 현황판: 선택 안됨</span>
            <span id="progress-percent">0%</span>
        </div>
        <div class="bar-outer">
            <div id="progress-bar" class="bar-inner"></div>
        </div>
    </div>

    <!-- 파티원 목록 섹션 -->
    <div class="party-box">
        <div class="party-header">
            <span>참가 파티원 목록</span>
        </div>
        <div class="member-tags" id="member-list"></div>
        <div class="add-member-form admin-only">
            <input type="text" id="new-member-name" placeholder="파티원 이름 입력">
            <button class="btn-sm" onclick="addMember()">파티원 추가</button>
        </div>
    </div>

    <!-- 파티 제작 목표 순서 섹션 -->
    <div class="party-box">
        <div class="party-header">
            <span>파티 제작 목표 대기열</span>
        </div>
        <div class="goal-tags" id="goal-list"></div>
        <div class="add-member-form admin-only">
            <select id="goal-maker-select"></select>
            <select id="goal-weapon-select">
                <option value="lance">소울 리버레이트 랜스</option>
                <option value="lyre">소울 리버레이트 리라</option>
                <option value="" disabled>──────────</option>
                <option value="" disabled>소울 리버레이트 한손검 (추후 예정)</option>
                <option value="" disabled>소울 리버레이트 양손검 (추후 예정)</option>
                <option value="" disabled>소울 리버레이트 너클 (추후 예정)</option>
                <option value="" disabled>소울 리버레이트 활 (추후 예정)</option>
                <option value="" disabled>소울 리버레이트 스태프 (추후 예정)</option>
                <option value="" disabled>소울 리버레이트 실린더 (추후 예정)</option>
            </select>
            <button class="btn-sm" onclick="addGoal()">목표 추가</button>
        </div>
    </div>

    <!-- [관리자 전용] 빠른 수량 기입/편집 테이블 -->
    <div class="section-card sec-admin-input admin-only">
        <div class="section-title">
            <span>관리자 빠른 재료 수량 입력 대시보드</span>
        </div>
        <div class="admin-table-container">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>재료명</th>
                        <th>실제 동적 남은 필요</th>
                        <th>현재 보유 수량 (입력)</th>
                        <th>파티원 코멘트 (입력)</th>
                    </tr>
                </thead>
                <tbody id="admin-input-tbody"></tbody>
            </table>
        </div>
    </div>

    <!-- [일반 사용자 전용] 1. 최상위 제작 재료 현황 -->
    <div class="section-card sec-my user-only">
        <div class="section-title">
            <span>재료 현황 (최상위 제작 재료)</span>
            <button class="toggle-btn" id="my-toggle-btn" onclick="toggleSection('my-items-list', 'my-toggle-btn')">접기 ▲</button>
        </div>
        <div id="my-items-list" class="item-grid"></div>
    </div>

    <!-- [일반 사용자 전용] 2. 파티 재료 전체 총합 모아보기 -->
    <div class="section-card sec-summary user-only">
        <div class="section-title">
            <span>현재 제작 목표 재료 총합 모아보기</span>
            <button class="toggle-btn" id="sum-toggle-btn" onclick="toggleSection('summary-grid', 'sum-toggle-btn')">접기 ▲</button>
        </div>
        <div id="summary-grid" class="summary-grid"></div>
    </div>

    <!-- [일반 사용자 전용] 3. 남은 재료 (하위/하하위 재료 트리) -->
    <div class="section-card sec-rem user-only">
        <div class="section-title">
            <span>남은 재료 (하위 재료 포함)</span>
            <button class="toggle-btn" id="rem-toggle-btn" onclick="toggleSection('rem-items-list', 'rem-toggle-btn')">펴기 ▼</button>
        </div>
        <div id="rem-items-list" class="item-grid" style="display: none;"></div>
    </div>
</div>

function getFormattedTime() {
    const now = new Date();
    const yyyy = now.getFullYear();
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    const hh = String(now.getHours()).padStart(2, '0');
    const min = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd} ${hh}:${min}:${ss}`;
}

function loadData() {
    const saved = localStorage.getItem('soul_lance_v2_data');
    if (saved) {
        try { 
            appData = JSON.parse(saved);
            if (!appData.posts) appData.posts = [];
            if (!appData.goals || appData.goals.length === 0) {
                appData.goals = [{ id: 101, maker: "반류화", weaponKey: "lance" }];
            }
            if (!appData.activeGoalId && appData.goals.length > 0) {
                appData.activeGoalId = appData.goals[0].id;
            }
            if (!appData.members || appData.members.length === 0) {
                appData.members = ["노아르파냐", "담야", "반류화"];
            }
        } catch(e) {}
    }
    viewGoalId = appData.activeGoalId;
}

function saveData() {
    previousBackup = localStorage.getItem('soul_lance_v2_data');
    appData.lastUpdated = getFormattedTime();
    localStorage.setItem('soul_lance_v2_data', JSON.stringify(appData));
    alert("저장되었습니다! 파티원들에게 최신 현황이 공유됩니다.");
    render();
}

function undoLastSave() {
    if (!previousBackup) {
        alert("되돌릴 수 있는 이전 저장 기록이 없습니다.");
        return;
    }
    if (confirm("정말로 마지막 저장 직전 상태로 되돌리시겠습니까?")) {
        localStorage.setItem('soul_lance_v2_data', previousBackup);
        loadData();
        render();
        alert("성공적으로 이전 상태로 복구되었습니다.");
    }
}

    appData.goals = appData.goals.filter(g => g.id !== goalId);
    if (appData.activeGoalId === goalId) {
        appData.activeGoalId = appData.goals.length > 0 ? appData.goals[0].id : null;
    }
    if (viewGoalId === goalId) {

function addPost() {
    const writerSelect = document.getElementById('post-writer-select');
    const targetSelect = document.getElementById('post-target-select');
    const writer = writerSelect.value;
    const targetWeapon = targetSelect.value;
    const pw = document.getElementById('post-pw').value.trim();
    const content = document.getElementById('post-content').value.trim();

    if (!writer) {
        alert("작성자를 선택해 주세요.");
        return;
    }
    if (!pw || !content) {
        alert("비밀번호와 내용을 모두 입력해 주세요.");
        return;
    }

    const now = new Date();
    const timeStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;

    appData.posts.unshift({
        id: Date.now(),

        targetWeapon,
        pw,
        content,
        time: timeStr,
        isApplied: false
    });

    document.getElementById('post-content').value = '';
    document.getElementById('post-pw').value = '';
    saveDataQuietly();
    renderBoard();
}

        renderBoard();
    }
}

    const targetSelect = document.getElementById('post-target-select');

        appData.goals.forEach(goal => {
            const wName = recipes[goal.weaponKey] ? recipes[goal.weaponKey].name : goal.weaponKey;
            const opt = document.createElement('option');
            opt.value = `${goal.maker}의 ${wName}`;

                opt.selected = true;

    const container = document.getElementById('board-list');
    container.innerHTML = '';

    if (!appData.posts || appData.posts.length === 0) {
        container.innerHTML = '<div style="color:var(--text-sub); text-align:center; padding:12px;">작성된 게시글이 없습니다.</div>';

                    <span style="font-size:0.75rem; margin-left:6px;">(${post.time})</span>

                    <button class="btn-apply-toggle" onclick="toggleApplyPost(${post.id})">${post.isApplied ? '적용취소' : '적용완료'}</button>

            </div>
            <div class="board-content">${escapeHtml(post.content)}</div>
        `;
        container.appendChild(item);
    });

    updateUnreadBadge();
}

function escapeHtml(str) {
    return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
    });
}

// 동적 연쇄 필요수량 연산 함수 (상위 완성 시 하위 필요 수량 자동 감소)
function processNodeDynamic(node, depth, parentRemainingNeed = 0, topItems, remItems, progressCalc, summaryMap, flatList) {
    const storageKey = `${viewGoalId}_${node.id}`;
    const have = appData.have[storageKey] || 0;
    const comment = appData.comments[storageKey] || "";

    // 1. 실제 필요 수량 계산 (상위 재료의 남은 필요 수량 기준)
    let required = 0;
    if (depth === 0) {
        required = node.need;
    } else {
        required = parentRemainingNeed * node.ratio;
    }

    // 2. 남은 필요 수량 계산
    const remaining = Math.max(0, required - have);

    if (depth === 0) {
        progressCalc.total += required;
        progressCalc.current += Math.min(have, required);
        topItems.push({ id: node.id, name: node.name, have, required, remaining, comment });
    }

    if (!summaryMap[node.name]) {
        summaryMap[node.name] = { req: 0, have: 0, rem: 0, count: 0 };
    }
    summaryMap[node.name].req += required;
    summaryMap[node.name].have += have;
    summaryMap[node.name].rem += remaining;
    summaryMap[node.name].count += 1;

    remItems.push({
        id: node.id, name: node.name, have, required, remaining, depth, ratio: node.ratio, comment
    });

    if (flatList) {
        flatList.push({ id: node.id, name: node.name, required, remaining, have, comment });
    }

    // 3. 자식 노드로 상위의 남은 필요량(remaining)을 전달하여 하위 수량 자동 차감 연쇄
    if (node.children) {
        node.children.forEach(child => processNodeDynamic(child, depth + 1, remaining, topItems, remItems, progressCalc, summaryMap, flatList));
    }
}

function render() {
    document.getElementById('last-update-time').innerText = `최종 업데이트: ${appData.lastUpdated || '없음'}`;

    const memberContainer = document.getElementById('member-list');
    memberContainer.innerHTML = '';
    appData.members.forEach(m => {
        const tag = document.createElement('div');
        tag.className = 'member-tag';
        tag.innerHTML = `<span>${m}</span>${isAdmin ? `<span class="del-btn" onclick="removeMember('${m}')">X</span>` : ''}`;
        memberContainer.appendChild(tag);
    });

    const goalMakerSelect = document.getElementById('goal-maker-select');
    goalMakerSelect.innerHTML = '';
    appData.members.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.innerText = m;
        goalMakerSelect.appendChild(opt);
    });

    const goalContainer = document.getElementById('goal-list');
    goalContainer.innerHTML = '';

    let viewGoalObj = null;

    if (appData.goals.length === 0) {
        goalContainer.innerHTML = '<div style="color:var(--text-sub); text-align:center; padding:8px;">등록된 제작 목표가 없습니다.</div>';
    } else {
        if (!viewGoalId || !appData.goals.find(g => g.id === viewGoalId)) {
            viewGoalId = appData.goals[0].id;
        }

        appData.goals.forEach(goal => {
            const isSelectedView = goal.id === viewGoalId;
            const isMainActive = goal.id === appData.activeGoalId;

            if (isSelectedView) viewGoalObj = goal;

            const wName = recipes[goal.weaponKey] ? recipes[goal.weaponKey].name : goal.weaponKey;

            const div = document.createElement('div');
            let classList = ['goal-item'];
            if (isMainActive) classList.push('main-active');
            if (isSelectedView) classList.push('view-selected');

            div.className = classList.join(' ');
            div.onclick = () => selectViewGoal(goal.id);

            let badgeHtml = '';
            if (isMainActive) {
                badgeHtml += '<span class="badge-main">대표 진행 중</span>';
            } else {
                badgeHtml += '<span class="badge-waiting">대기 중</span>';
            }

            if (isSelectedView) {
                badgeHtml += '<span class="badge-viewing">조회 중</span>';
            }

            div.innerHTML = `
                <div>
                    제작자: <span class="goal-maker">${goal.maker}</span> -> 제작물: <span class="goal-target">${wName}</span>
                    ${badgeHtml}
                </div>
                <div>
                    ${isAdmin && !isMainActive ? `<button class="btn-activate" onclick="setActiveGoal(${goal.id}, event)">대표 목표로 변경</button>` : ''}
                    ${isAdmin ? `<span class="del-btn" onclick="removeGoal(${goal.id}, event)">삭제 X</span>` : ''}
                </div>
            `;
            goalContainer.appendChild(div);
        });
    }

    const topItems = [];
    const remItems = [];
    const flatList = [];
    const progressCalc = { total: 0, current: 0 };
    const summaryMap = {};

    if (viewGoalObj && recipes[viewGoalObj.weaponKey]) {
        document.getElementById('active-goal-title').innerText = `현재 조회 중: [${viewGoalObj.maker}] ${recipes[viewGoalObj.weaponKey].name}`;
        
        recipes[viewGoalObj.weaponKey].tree.forEach(node => {
            processNodeDynamic(node, 0, 0, topItems, remItems, progressCalc, summaryMap, flatList);
        });
    } else {
        document.getElementById('active-goal-title').innerText = '현재 선택된 목표: 없음';
    }

    // 관리자 빠른 수량 기입 테이블 (동적 남은 수량 반영)
    const adminTbody = document.getElementById('admin-input-tbody');
    adminTbody.innerHTML = '';
    flatList.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td style="font-weight:bold; color:var(--text-main);">${item.name}</td>
            <td style="color:var(--gold-main); font-weight:bold;">${item.remaining}개 (총필요 ${item.required}개)</td>
            <td>
                <input type="number" min="0" value="${item.have}" onchange="updateQty('${item.id}', this.value)">
            </td>
            <td>
                <input type="text" value="${item.comment}" placeholder="코멘트 입력 (예: 경매장 구매완료)" onchange="updateComment('${item.id}', this.value)">
            </td>
        `;
        adminTbody.appendChild(tr);
    });

    // 일반 사용자 뷰
    const myContainer = document.getElementById('my-items-list');
    myContainer.innerHTML = topItems.length === 0 ? '<div style="color:var(--text-sub); text-align:center; padding:12px;">선택된 목표가 없습니다.</div>' : '';

    topItems.forEach(item => {
        const isDone = item.remaining === 0;
        const card = document.createElement('div');
        card.className = `item-card ${isDone ? 'is-done' : ''}`;

        let statusTag = isDone
            ? `<span class="item-qty-tag qty-done">V 수집 완료</span>`
            : `<span class="item-qty-tag qty-need">남은 필요 ${item.remaining}개</span>`;

        card.innerHTML = `
            <div class="item-main-row">
                <span class="item-name">${item.name}</span>
                <div style="display:flex; align-items:center; gap:8px;">
                    <span class="item-qty-tag qty-have">보유 ${item.have}개</span>
                    ${statusTag}
                </div>
            </div>
            ${item.comment ? `<div class="comment-row">${item.comment}</div>` : ''}
        `;
        myContainer.appendChild(card);
    });

    const summaryContainer = document.getElementById('summary-grid');
    summaryContainer.innerHTML = Object.keys(summaryMap).length === 0 ? '<div style="color:var(--text-sub); text-align:center; padding:12px;">표시할 합계 재료가 없습니다.</div>' : '';

    Object.keys(summaryMap).forEach(name => {
        const stat = summaryMap[name];
        const isDone = stat.rem === 0;
        if (stat.req > 0) {
            const card = document.createElement('div');
            card.className = `summary-card ${stat.count > 1 ? 'is-common' : ''} ${isDone ? 'is-completed' : ''}`;
            card.innerHTML = `
                <div class="summary-name">
                    ${name}
                    ${stat.count > 1 ? '<span class="common-badge">공통재료</span>' : ''}
                </div>
                <div class="summary-stats">
                    <span>총 필요: ${stat.req}개</span>
                    <span>보유: ${stat.have}개</span>
                </div>
                <div class="${isDone ? 'summary-completed-text' : 'summary-rem'}">
                    ${isDone ? 'V 준비 완료' : `-> 남은 총 필요: ${stat.rem}개`}
                </div>
            `;
            summaryContainer.appendChild(card);
        }
    });

    const percent = progressCalc.total > 0 ? Math.round((progressCalc.current / progressCalc.total) * 100) : 0;
    document.getElementById('progress-bar').style.width = percent + '%';
    document.getElementById('progress-percent').innerText = percent + '%';

    const remContainer = document.getElementById('rem-items-list');
    remContainer.innerHTML = '';

    const commonItems = remItems.filter(i => summaryMap[i.name].count > 1);
    const uniqueItems = remItems.filter(i => summaryMap[i.name].count === 1);

    if (commonItems.length > 0) {
        const commonGroupTitle = document.createElement('div');
        commonGroupTitle.className = 'sub-group-title';
        commonGroupTitle.innerText = '여러 제작에 중복해서 들어가는 공통 재료 목록';
        remContainer.appendChild(commonGroupTitle);

        commonItems.forEach(item => remContainer.appendChild(createRemCard(item)));
    }

    if (uniqueItems.length > 0) {
        const uniqueGroupTitle = document.createElement('div');
        uniqueGroupTitle.className = 'sub-group-title';
        uniqueGroupTitle.innerText = '특정 제작 전용 단독 재료 목록';
        remContainer.appendChild(uniqueGroupTitle);

        uniqueItems.forEach(item => remContainer.appendChild(createRemCard(item)));
    }

    renderBoard();
}

function createRemCard(item) {
    const isDone = item.remaining === 0;
    const card = document.createElement('div');
    card.className = `item-card depth-${item.depth} ${isDone ? 'is-done' : ''}`;

    let statusTag = isDone 
        ? `<span class="item-qty-tag qty-done">V 완료</span>`
        : `<span class="item-qty-tag qty-need">남은 필요 ${item.remaining}개</span>`;

    card.innerHTML = `
        <div class="item-main-row">
            <div>
                <span class="item-name">${item.name}</span>
                ${item.depth > 0 ? `<small style="color:var(--text-sub); margin-left:6px;">(1개당 ${item.ratio}개)</small>` : ''}
            </div>
            ${statusTag}
        </div>
        ${item.comment ? `<div class="comment-row">${item.comment}</div>` : ''}
    `;
    return card;
}

loadData();
render();
</script>

</body>
</html>
